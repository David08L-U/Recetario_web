<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recetario</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- NUEVO: aviso fijo cuando no hay internet -->
  <div id="banner-offline" role="alert" hidden>📡 Sin conexión a internet. Revisa tu red; la página se actualizará cuando vuelva.</div>

  <header>
    <!-- NUEVO: selector de idioma -->
    <div class="idioma" role="group" aria-label="Idioma de las recetas">
      <button type="button" data-idioma="es">🇲🇽 ES</button>
      <button type="button" data-idioma="en">🇺🇸 EN</button>
    </div>

    <h1><a href="#" id="logo">🍳 Recetario</a></h1>
    <p class="subtitulo">Encuentra qué cocinar hoy</p>

    <form id="form-busqueda">
      <input type="text" id="input-busqueda" placeholder="Busca una receta (ej. pasta, pollo, tacos)">
      <button type="submit">Buscar</button>
    </form>

    <!-- NUEVO: botones de categorías -->
    <nav id="categorias" aria-label="Categorías">
      <button class="chip" data-categoria="desayunos">🥞 Desayunos</button>
      <button class="chip" data-categoria="comida">🍝 Comida</button>
      <button class="chip" data-categoria="cena">🌙 Cena</button>
      <button class="chip" data-categoria="postres">🍰 Postres</button>
      <button class="chip" data-categoria="entradas">🥟 Entradas</button>
      <button class="chip" data-categoria="sopas">🍲 Sopas</button>
      <button class="chip" data-categoria="ensaladas">🥗 Ensaladas</button>
      <button class="chip" data-categoria="bebidas">🥤 Bebidas</button>
      <button class="chip" data-categoria="vegetariano">🥕 Vegetariano</button>
      <button class="chip" data-categoria="vegano">🌱 Vegano</button>
      <button class="chip" data-categoria="sin-gluten">🌾 Sin gluten</button>
    </nav>
  </header>

  <main>
    <!-- NUEVO: pantalla principal (se oculta al buscar) -->
    <div id="inicio">
      <section id="receta-del-dia" class="hero">
        <p class="cargando">Cargando receta del día...</p>
      </section>

      <section>
        <h2 class="titulo-seccion">⭐ Recetas destacadas</h2>
        <div id="destacadas" class="grid"></div>
      </section>
    </div>

    <!-- Resultados de búsqueda / categoría (oculto al inicio) -->
    <div id="vista-resultados" hidden>
      <div class="barra-resultados">
        <h2 id="titulo-resultados" class="titulo-seccion"></h2>
        <button id="btn-volver" class="btn-secundario">← Volver al inicio</button>
      </div>
      <p id="mensaje"></p>
      <section id="resultados" class="grid"></section>

      <!-- NUEVO: paginación -->
      <div class="paginacion">
        <p id="contador"></p>
        <button id="btn-ver-mas" class="btn-primario" hidden>Ver más recetas</button>
      </div>
    </div>
  </main>

  <!-- Modal para el detalle de la receta -->
  <dialog id="modal">
    <button id="cerrar-modal" aria-label="Cerrar">✕</button>
    <div id="detalle"></div>
  </dialog>

  <!-- NUEVO: avisos flotantes -->
  <div id="toast" role="status" aria-live="polite"></div>

  <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recetario</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>🍳 Recetario</h1>
    <form id="form-busqueda">
      <input type="text" id="input-busqueda" placeholder="Busca una receta (ej. pasta, pollo, tacos)" required>
      <button type="submit">Buscar</button>
    </form>
  </header>

  <main>
    <p id="mensaje"></p>
    <section id="resultados" class="grid"></section>
  </main>

  <!-- Modal para el detalle de la receta -->
  <dialog id="modal">
    <button id="cerrar-modal" aria-label="Cerrar">✕</button>
    <div id="detalle"></div>
  </dialog>

  <script src="script.js"></script>
</body>
</html>
